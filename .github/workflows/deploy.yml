name: Deploy Frontend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiosnova-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_ENABLE_MOCK: 'true'
        run: npm run build

      - name: Validate build
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Create release archive
        run: tar -czf frontend-release.tar.gz -C dist .

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: frontend-release.tar.gz
          target: /home/deploy/uploads/

      - name: Publish frontend
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: RELEASE_SHA
          script_stop: true
          command_timeout: 5m
          script: |
            set -eu

            BASE="/var/www/aiosnova-releases"
            TARGET="$BASE/$RELEASE_SHA"

            test ! -e "$TARGET"
            mkdir -m 2750 "$TARGET"

            tar -xzf /home/deploy/uploads/frontend-release.tar.gz -C "$TARGET"

            test -s "$TARGET/index.html"

            find "$TARGET" -type d -exec chmod 2750 {} \;
            find "$TARGET" -type f -exec chmod 640 {} \;

            /usr/local/bin/aiosnova-frontend-release "$RELEASE_SHA"

            rm -f /home/deploy/uploads/frontend-release.tar.gz

            echo "Frontend deployed: $RELEASE_SHA"
